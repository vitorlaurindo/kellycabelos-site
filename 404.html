<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada: KELLY Terapia Capilar &amp; Head Spa</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f1e7d5">
<script>
  // old storefront links (kellycabelos.com.br/v/kellycabelos/...) keep working on the Vitrinis domain
  (function () {
    var p = location.pathname;
    if (p.indexOf('/v/') === 0) location.replace('https://www.vitrinis.com.br' + p + location.search);
    else if (p.indexOf('/loja') === 0) location.replace('https://www.vitrinis.com.br/v/kellycabelos');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Jost:wght@400..600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%; background: #f1e7d5; color: #173b35; font: 400 17px/1.6 "Jost", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font: 400 clamp(36px, 5vw, 56px)/1.1 "GFS Didot", Georgia, serif; margin: 0 0 16px; }
  p { margin: 0 0 32px; }
  a.btn { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 12px; background: #173b35; color: #f1e7d5; text-decoration: none; font-weight: 500; }
  a.btn:active { transform: scale(.97); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Página não encontrada</h1>
    <p>O endereço mudou ou não existe mais.</p>
    <a class="btn" href="/">Ir para o início</a>
  </div>
</main>
</body>
</html>
